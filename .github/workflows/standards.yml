# The lint check: peachycheck's action at a commit checks the repository out,
# installs peachycheck and its linters and lints with this repository's
# peachycheck.yml (the files changed since the base on a pull request, every
# file on main). Builds and tests run in tests.yml. The organization's
# ruleset requires the job's name: `standards`.
name: Standards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: drexlerd/peachycheck@343fddca95ebb4eb277a5598bae6af8ea0aac863
        with:
          # pyright resolves imports in the repository's environment.
          prepare: uv sync --locked
