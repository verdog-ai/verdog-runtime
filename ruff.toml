# ruff's configuration: only settings that differ from ruff's defaults,
# each with its reason.

# Narrower than the default 88, so two files fit side by side.
line-length = 80
# The oldest Python the organization supports.
target-version = "py312"
# `peachycheck lint` passes the files; the excludes below still apply.
force-exclude = true

[lint]
# Beyond the default E4, E7, E9 and F: style, imports, bugbear, upgrades,
# simplifications, comprehensions, docstrings, complexity and naming.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "TID252", "D", "C90", "N"]
# PEP 695 syntax stays optional: TypeAlias and TypeVar spellings are allowed.
ignore = ["UP040", "UP046", "UP047"]

# The formatter keeps code at 80 columns; strings and comments it cannot wrap
# may reach 100.
[lint.pycodestyle]
max-line-length = 100

# Raised from McCabe's threshold of 10 (the default): split a function above 15.
[lint.mccabe]
max-complexity = 15

# Google Python Style Guide docstrings (default: no convention).
[lint.pydocstyle]
convention = "google"

# Absolute imports only (default: only parent-relative imports are banned).
[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.per-file-ignores]
# Test names and assertions document the behavior; helpers need no public API
# docs. Every assertion counts as a branch, so tests are exempt from C901.
"**/tests/**" = ["D", "C901"]
"**/test_*.py" = ["D", "C901"]

# Format the examples in docstrings too (default: off).
[format]
docstring-code-format = true
