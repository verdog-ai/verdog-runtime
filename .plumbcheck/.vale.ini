# Vale's configuration for reStructuredText: Google's developer documentation
# style (errata-ai/Google v0.7.1, vendored) and auto-se's rules, written by
# `plumbcheck sync` into .plumbcheck/ with the styles. `lint` passes it unless
# the repository has its own .vale.ini, which then sets StylesPath =
# .plumbcheck/styles and repeats what it keeps (Vale cannot extend a file).
# Only settings that differ from Vale's defaults, each with its reason.

# The vendored styles next to this file (Vale has no default).
StylesPath = styles

[*.rst]
# Google's style and auto-se's rules (default: Vale's own style only).
BasedOnStyles = Google, AutoSE
# Contractions are fine in our docs, unlike in Google's.
Google.Contractions = NO
