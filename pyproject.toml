[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "verdog-runtime"
version = "0.1.3"
description = "The Verdog workflow runtime."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["cloudpickle>=3.1.2", "typing-extensions>=4.13", "tyro>=1", "tabulate>=0.10"]

[project.urls]
Repository = "https://github.com/verdog-ai/verdog-runtime"
Documentation = "https://github.com/verdog-ai/verdog-website/tree/main/site"

[dependency-groups]
dev = [
    "pytest",
    "pyright==1.1.411",
    "types-tabulate",
    "ruff==0.16.9",
    "pylint==4.0.9",
    "radon==6.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["verdog_runtime*"]

[tool.setuptools.package-data]
verdog_runtime = ["py.typed"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "TID252", "D"]
# Runtime generic parameters are inspected by tyro and persisted in checkpoints.
# Changing their representation is an API change, not a style-only rewrite.
ignore = ["UP040", "UP046", "UP047"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Test names and assertions document the behavior; helpers need no public API docs.
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true
